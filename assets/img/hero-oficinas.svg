<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f2"/>
      <stop offset=".55" stop-color="#eef6fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="cristal1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9c6d8"/>
      <stop offset=".5" stop-color="#d7e8f2"/>
      <stop offset="1" stop-color="#9db9cc"/>
    </linearGradient>
    <linearGradient id="cristal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bcd4e2"/>
      <stop offset=".5" stop-color="#e4f0f7"/>
      <stop offset="1" stop-color="#aecadd"/>
    </linearGradient>
    <radialGradient id="sol" cx=".78" cy=".18" r=".45">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ventanas" width="46" height="38" patternUnits="userSpaceOnUse">
      <rect width="46" height="38" fill="none"/>
      <rect x="6" y="6" width="34" height="24" fill="#7fa3b8" opacity=".55"/>
      <rect x="6" y="6" width="34" height="8" fill="#ffffff" opacity=".5"/>
    </pattern>
    <pattern id="ventanas2" width="38" height="44" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="28" height="28" fill="#8fb0c2" opacity=".5"/>
      <rect x="5" y="7" width="28" height="9" fill="#ffffff" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#cielo)"/>
  <rect width="1600" height="900" fill="url(#sol)"/>

  <!-- nubes claras -->
  <g fill="#ffffff" opacity=".8">
    <ellipse cx="300" cy="150" rx="130" ry="34"/>
    <ellipse cx="420" cy="120" rx="100" ry="28"/>
    <ellipse cx="1150" cy="90" rx="150" ry="36"/>
    <ellipse cx="1300" cy="130" rx="110" ry="26"/>
    <ellipse cx="700" cy="70" rx="90" ry="22"/>
  </g>

  <!-- edificios de cristal claros y brillantes -->
  <g>
    <rect x="60" y="240" width="300" height="660" fill="url(#cristal1)"/>
    <rect x="60" y="240" width="300" height="660" fill="url(#ventanas)"/>
    <rect x="60" y="240" width="300" height="14" fill="#ffffff" opacity=".7"/>

    <rect x="400" y="140" width="360" height="760" fill="url(#cristal2)"/>
    <rect x="400" y="140" width="360" height="760" fill="url(#ventanas2)"/>
    <rect x="400" y="140" width="360" height="14" fill="#ffffff" opacity=".7"/>
    <rect x="560" y="60" width="40" height="80" fill="#9db9cc"/>

    <rect x="800" y="300" width="260" height="600" fill="url(#cristal1)"/>
    <rect x="800" y="300" width="260" height="600" fill="url(#ventanas)"/>

    <rect x="1100" y="180" width="340" height="720" fill="url(#cristal2)"/>
    <rect x="1100" y="180" width="340" height="720" fill="url(#ventanas2)"/>
    <rect x="1100" y="180" width="340" height="14" fill="#ffffff" opacity=".7"/>

    <rect x="1470" y="360" width="130" height="540" fill="url(#cristal1)"/>
    <rect x="1470" y="360" width="130" height="540" fill="url(#ventanas)"/>
  </g>

  <!-- reflejos y brillos -->
  <g fill="#ffffff" opacity=".35">
    <polygon points="120,240 200,240 150,900 70,900"/>
    <polygon points="480,140 580,140 520,900 420,900"/>
    <polygon points="1180,180 1270,180 1220,900 1130,900"/>
  </g>
  <rect y="820" width="1600" height="80" fill="#e8f1f6" opacity=".6"/>
</svg>
